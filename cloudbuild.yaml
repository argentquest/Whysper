# ============================================================================
# Google Cloud Build Configuration for Whysper Web2
# Automated CI/CD Pipeline for Cloud Run Deployment
# ============================================================================
#
# This file defines the build pipeline for automated deployment to Cloud Run.
# Triggered by: git push to main branch
#
# Prerequisites:
# 1. Enable Cloud Build API: gcloud services enable cloudbuild.googleapis.com
# 2. Grant Cloud Build permissions:
#    - Cloud Run Admin
#    - Service Account User
# 3. Create secrets in Secret Manager:
#    - WHYSPER_API_KEY
#    - WHYSPER_ACCESS_KEY
# 4. Connect repository to Cloud Build triggers
#
# ============================================================================

# Build Steps
steps:
  # ============================================================================
  # Step 1: Build Container Image
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '.'
    timeout: 1800s  # 30 minutes

  # ============================================================================
  # Step 2: Push Image to Artifact Registry
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image-sha'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}'
    waitFor: ['build-image']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image-latest'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest'
    waitFor: ['build-image']

  # ============================================================================
  # Step 3: Scan Image for Vulnerabilities (Optional but Recommended)
  # ============================================================================
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'scan-image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Scanning image for vulnerabilities..."
        gcloud artifacts docker images scan \
          ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA} \
          --location=${_REGION} || true
        echo "Vulnerability scan complete (non-blocking)"
    waitFor: ['push-image-sha']

  # ============================================================================
  # Step 4: Deploy to Cloud Run (Production)
  # ============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-production'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=${_SERVICE_ACCOUNT}'
      - '--memory=${_MEMORY}'
      - '--cpu=${_CPU}'
      - '--timeout=${_TIMEOUT}'
      - '--concurrency=${_CONCURRENCY}'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '--port=8080'
      - '--set-env-vars=PROVIDER=openrouter,DEFAULT_MODEL=google/gemini-2.5-flash-preview-09-2025,PORT=8080,API_HOST=0.0.0.0'
      - '--set-secrets=API_KEY=WHYSPER_API_KEY:latest,ACCESS_KEY=WHYSPER_ACCESS_KEY:latest'
      - '--labels=deployed-by=cloud-build,commit=${SHORT_SHA},branch=${BRANCH_NAME}'
    waitFor: ['push-image-sha', 'scan-image']

  # ============================================================================
  # Step 5: Verify Deployment Health
  # ============================================================================
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'verify-deployment'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Waiting for service to be ready..."
        sleep 10

        SERVICE_URL=$(gcloud run services describe ${_SERVICE_NAME} \
          --region=${_REGION} \
          --format='value(status.url)')

        echo "Service URL: $SERVICE_URL"

        # Test health endpoint
        echo "Testing health endpoint..."
        curl -f $SERVICE_URL/api/v1/ || exit 1

        echo "✅ Deployment successful and healthy!"
        echo "🚀 Application is live at: $SERVICE_URL"
    waitFor: ['deploy-production']

  # ============================================================================
  # Step 6: Tag Image with Branch Name (for tracking)
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'tag-branch'
    args:
      - 'tag'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${BRANCH_NAME}'
    waitFor: ['push-image-sha']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-branch-tag'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${BRANCH_NAME}'
    waitFor: ['tag-branch']

# ============================================================================
# Substitution Variables
# Override these when creating the trigger or via gcloud command
# ============================================================================
substitutions:
  # GCP Configuration
  _REGION: 'us-central1'
  _REPOSITORY: 'whysper-repo'
  _IMAGE: 'whysper-web2'

  # Cloud Run Service Configuration
  _SERVICE_NAME: 'whysper-app'
  _SERVICE_ACCOUNT: 'whysper-cloudrun-sa@${PROJECT_ID}.iam.gserviceaccount.com'

  # Resource Allocation
  _MEMORY: '2Gi'
  _CPU: '1'
  _TIMEOUT: '300'
  _CONCURRENCY: '80'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '10'

# ============================================================================
# Images to Store in Artifact Registry
# ============================================================================
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${BRANCH_NAME}'

# ============================================================================
# Build Options
# ============================================================================
options:
  # Logging configuration
  logging: CLOUD_LOGGING_ONLY

  # Machine type for build (affects build speed and cost)
  # Options: N1_HIGHCPU_8, N1_HIGHCPU_32, E2_HIGHCPU_8, E2_HIGHCPU_32
  machineType: 'E2_HIGHCPU_8'

  # Build timeout (max 24 hours)
  timeout: '1800s'  # 30 minutes

  # Enable Docker layer caching for faster builds
  env:
    - 'DOCKER_BUILDKIT=1'

# ============================================================================
# Automatic Trigger Configuration (via gcloud)
# ============================================================================
#
# Create trigger for main branch:
#
# gcloud builds triggers create github \
#   --name="whysper-deploy-prod" \
#   --repo-name="Whysper" \
#   --repo-owner="YOUR_GITHUB_USERNAME" \
#   --branch-pattern="^main$" \
#   --build-config="cloudbuild.yaml"
#
# Create trigger for staging branch:
#
# gcloud builds triggers create github \
#   --name="whysper-deploy-staging" \
#   --repo-name="Whysper" \
#   --repo-owner="YOUR_GITHUB_USERNAME" \
#   --branch-pattern="^staging$" \
#   --build-config="cloudbuild.yaml" \
#   --substitutions="_SERVICE_NAME=whysper-app-staging,_MIN_INSTANCES=0,_MAX_INSTANCES=3"
#
# ============================================================================

# ============================================================================
# Manual Build Command
# ============================================================================
#
# Build and deploy manually:
#
# gcloud builds submit \
#   --config=cloudbuild.yaml \
#   --substitutions=_SERVICE_NAME=whysper-app,_REGION=us-central1
#
# ============================================================================

# ============================================================================
# Service Account Permissions Required
# ============================================================================
#
# Grant Cloud Build service account the following roles:
#
# gcloud projects add-iam-policy-binding PROJECT_ID \
#   --member="serviceAccount:PROJECT_NUMBER@cloudbuild.gserviceaccount.com" \
#   --role="roles/run.admin"
#
# gcloud projects add-iam-policy-binding PROJECT_ID \
#   --member="serviceAccount:PROJECT_NUMBER@cloudbuild.gserviceaccount.com" \
#   --role="roles/iam.serviceAccountUser"
#
# ============================================================================
