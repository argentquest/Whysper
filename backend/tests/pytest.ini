[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

markers =
    provider: Tests for diagram provider system
    mermaid: Tests for Mermaid provider
    d2: Tests for D2 provider
    rendering: Tests for diagram rendering
    validation: Tests for diagram validation
    integration: Integration tests across providers
    slow: Slow running tests
