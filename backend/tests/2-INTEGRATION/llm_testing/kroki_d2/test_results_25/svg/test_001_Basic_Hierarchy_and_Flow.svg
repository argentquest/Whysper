<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
         refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
        </marker>
    </defs>
    <style>
        .node { fill: #f3e5f5; stroke: #4a148c; stroke-width: 2; }
        .node-text { font-family: Arial; font-size: 14px; text-anchor: middle; }
        .edge { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <rect class="node" x="100" y="75" width="100" height="50" rx="5"/>
    <text class="node-text" x="150" y="105">user</text>
    <rect class="node" x="250" y="75" width="100" height="50" rx="5"/>
    <text class="node-text" x="300" y="105">webserver: "HTTP/HTTPS"</text>
    <line class="edge" x1="200" y1="100" x2="250" y2="100"/>
    <rect class="node" x="250" y="75" width="100" height="50" rx="5"/>
    <text class="node-text" x="300" y="105">webserver</text>
    <rect class="node" x="400" y="75" width="100" height="50" rx="5"/>
    <text class="node-text" x="450" y="105">data-tier.primary-db: "Query"</text>
    <line class="edge" x1="350" y1="100" x2="400" y2="100"/>
    <rect class="node" x="400" y="75" width="100" height="50" rx="5"/>
    <text class="node-text" x="450" y="105">webserver</text>
    <rect class="node" x="550" y="75" width="100" height="50" rx="5"/>
    <text class="node-text" x="600" y="105">data-tier.backup-db: "Read Replica"</text>
    <line class="edge" x1="500" y1="100" x2="550" y2="100"/>
</svg>