<svg width="1200" height="500" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
         refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
        </marker>
    </defs>
    <style>
        .node { fill: #e1f5fe; stroke: #01579b; stroke-width: 2; }
        .node-text { font-family: Arial; font-size: 14px; text-anchor: middle; }
        .edge { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <rect class="node" x="150.0" y="225" width="100" height="50" rx="5"/>
    <text class="node-text" x="200.0" y="255">Process</text>
    <rect class="node" x="350.0" y="225" width="100" height="50" rx="5"/>
    <text class="node-text" x="400.0" y="255">Validate</text>
    <rect class="node" x="550.0" y="225" width="100" height="50" rx="5"/>
    <text class="node-text" x="600.0" y="255">OutputResult</text>
    <rect class="node" x="750.0" y="225" width="100" height="50" rx="5"/>
    <text class="node-text" x="800.0" y="255">Store</text>
    <rect class="node" x="950.0" y="225" width="100" height="50" rx="5"/>
    <text class="node-text" x="1000.0" y="255">InputData[Input Data]</text>
    <line class="edge" x1="1000.0" y1="275" x2="150.0" y2="225"/>
    <line class="edge" x1="200.0" y1="275" x2="350.0" y2="225"/>
    <line class="edge" x1="400.0" y1="275" x2="750.0" y2="225"/>
    <line class="edge" x1="800.0" y1="275" x2="550.0" y2="225"/>
</svg>